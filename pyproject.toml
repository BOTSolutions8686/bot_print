[project]
name = "bot_print"
authors = [
    { name = "BOT Solutions", email = "info@botsolutions.tech"}
]
description = "Reusable BOT Solutions print extras: cosmetic PDF foreign-currency amount on multi-currency invoices"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
